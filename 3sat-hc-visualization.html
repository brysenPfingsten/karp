const steps = data.steps;
const stepLabels = data.stepLabels || null;
const slider = document.getElementById('slider');
slider.max = steps.length;
let stepIndex = 0;
const activeNodes = new Set();
const activeEdges = new Set();
if (typeof cytoscape === 'undefined') {
  document.getElementById('debug').textContent = 'cytoscape failed to load';
} else {
const cy = cytoscape({
  container: document.getElementById('graph'),
  elements: data.nodes.map(n => ({ data: { id: n.id, label: n.label, kind: n.kind }, position: { x: n.x, y: n.y } }))
    .concat(data.edges.map(e => ({ data: { id: e.id, source: e.source, target: e.target } }))),
  layout: { name: 'preset' },
  style: [
    { selector: 'node', style: {
        'label': 'data(label)',
        'text-valign': 'center',
        'text-halign': 'center',
        'width': 18,
        'height': 18,
        'font-size': 8,
        'color': '#1b1b1b',
        'background-color': '#c0c0c0',
        'border-color': '#111',
        'border-width': 1
      }
    },
    { selector: 'edge', style: {
        'curve-style': 'bezier',
        'target-arrow-shape': 'triangle',
        'line-color': '#4b4b4b',
        'target-arrow-color': '#4b4b4b',
        'width': 1.4,
        'opacity': 0.7
      }
    },
    { selector: '.hidden', style: { 'display': 'none' } },
    { selector: 'node[kind = "var"]', style: { 'background-color': '#f7b32b' } },
    { selector: 'node[kind = "var-tail"]', style: { 'background-color': '#f6ae2d' } },
    { selector: 'node[kind = "clause"]', style: { 'background-color': '#f9564f' } },

  ]

cy.elements().addClass('hidden');
const nodeMeta = new Map(data.nodes.map(n => [n.id, n]));
cy.fit(cy.elements(), 40);
const baseZoom = cy.zoom();
const basePan = cy.pan();
function autoLabel(step) {
  const nodes = step.addNodes || [];
  const edges = step.addEdges || [];
  if (!nodes.length && edges.length) return 'Add edges';
  if (!nodes.length && !edges.length) return '';
  const kinds = new Set();
  for (const id of nodes) {
    const meta = nodeMeta.get(id);
    if (meta && meta.kind) kinds.add(meta.kind);
  }
  if (kinds.size === 1 && kinds.has('terminal')) return 'Add terminal nodes';
  if (kinds.size === 1 && kinds.has('clause')) return 'Add clause nodes';
  if (kinds.has('var') || kinds.has('var-tail')) return 'Add variable gadget nodes';
  return 'Add nodes';
}
function setStep(next) {
  stepIndex = Math.max(0, Math.min(next, steps.length));
  activeNodes.clear();
  activeEdges.clear();
  for (let i = 0; i < stepIndex; i++) {
    for (const n of steps[i].addNodes) activeNodes.add(n);
    for (const e of steps[i].addEdges) activeEdges.add(e);
  }
  cy.elements().addClass('hidden');
  for (const n of activeNodes) cy.getElementById(n).removeClass('hidden');
  for (const e of activeEdges) cy.getElementById(e).removeClass('hidden');
  slider.value = stepIndex;
  document.getElementById('stats').textContent = `Step ${stepIndex}/${steps.length} | Nodes ${activeNodes.size} | Edges ${activeEdges.size}`;
  const stepLabel = stepIndex > 0 ? (stepLabels && stepLabels[stepIndex - 1]) : '';
  document.getElementById('annotation').textContent = stepLabel || (stepIndex > 0 ? autoLabel(steps[stepIndex - 1]) : '');
  cy.zoom(baseZoom);
  cy.pan(basePan);
}
document.getElementById('back').addEventListener('click', () => setStep(stepIndex - 1));
document.getElementById('forward').addEventListener('click', () => setStep(stepIndex + 1));
document.getElementById('layout').addEventListener('click', () => {
  cy.layout({ name: 'cose', animate: true, fit: true }).run();
});
slider.addEventListener('input', (evt) => setStep(parseInt(evt.target.value, 10)));
setStep(stepIndex);
}
